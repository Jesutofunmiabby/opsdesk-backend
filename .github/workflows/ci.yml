# Builds the backend and runs every test on each push to main and on each pull
# request. The tests use the H2 "test" profile, so no database is needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          # Keeps downloaded Maven dependencies between runs, keyed on pom.xml.
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify
