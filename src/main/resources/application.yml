spring:
  application:
    name: opsdesk-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/opsdesk
    username: ${DB_USER:opsdesk}
    password: ${DB_PASSWORD:opsdesk}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

opsdesk:
  cors:
    # Frontend addresses allowed to call the API from a browser, separated by
    # commas.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
