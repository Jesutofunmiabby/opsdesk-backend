# Shared settings for every profile. The defaults here are safe for your own
# computer only. Pick a profile with the SPRING_PROFILES_ACTIVE environment
# variable: dev (the default when nothing is set) or prod. A profile file
# (application-dev.yml, application-prod.yml) is read after this one, so its
# values replace the ones here.
spring:
  application:
    name: opsdesk-backend
  profiles:
    # Used only when SPRING_PROFILES_ACTIVE is not set.
    default: dev
  datasource:
    # localhost on your computer; jdbc:postgresql://db:5432/opsdesk inside
    # Docker Compose, where the database container is called db.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opsdesk}
    username: ${DB_USER:opsdesk}
    password: ${DB_PASSWORD:opsdesk}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        # Only GET /actuator/health, so anything (Docker, a load balancer) can
        # ask "is the app alive?". Other endpoints such as env or heapdump can
        # reveal settings and secrets, so they stay off.
        include: health
  endpoint:
    health:
      # Just {"status":"UP"} or DOWN, with no details about the database.
      show-details: never

opsdesk:
  cors:
    # Frontend addresses allowed to call the API from a browser, separated by
    # commas.
    allowed-origins: ${ALLOWED_ORIGIN:http://localhost:5173}
  jwt:
    # Signs login tokens: anyone who knows it can make a token for any user.
    # At least 32 characters. The default is for your own computer only; the
    # prod profile has no default and refuses to start without JWT_SECRET.
    secret: ${JWT_SECRET:local-development-only-secret-not-for-real-use}
    # How long a token works after login, e.g. 24h or 30m.
    expiry: 24h

springdoc:
  # The API documentation: /v3/api-docs (JSON) and the Swagger page at
  # /swagger-ui.html. Both need no login (see SecurityConfig).
  # Every answer is JSON, so the docs say application/json, not */*.
  default-produces-media-type: application/json
