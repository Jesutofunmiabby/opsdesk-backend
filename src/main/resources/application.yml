spring:
  application:
    name: opsdesk-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/opsdesk
    username: ${DB_USER:opsdesk}
    password: ${DB_PASSWORD:opsdesk}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

logging:
  level:
    # Set SQL_LOG=debug to print every SQL statement Hibernate runs, for
    # example to count the queries behind one request.
    org.hibernate.SQL: ${SQL_LOG:info}

opsdesk:
  cors:
    # Frontend addresses allowed to call the API from a browser, separated by
    # commas.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Signs login tokens: anyone who knows it can make a token for any user.
    # At least 32 characters. The default is for your own computer only; set
    # JWT_SECRET to a long random value anywhere else.
    secret: ${JWT_SECRET:local-development-only-secret-not-for-real-use}
    # How long a token works after login, e.g. 24h or 30m.
    expiry: 24h
