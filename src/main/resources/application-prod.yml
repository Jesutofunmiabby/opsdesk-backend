# Production: quiet logs and no default for any secret. If JWT_SECRET or
# DB_PASSWORD is missing, the app must refuse to start instead of quietly
# running with the weak local defaults.
spring:
  datasource:
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

opsdesk:
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    com.opsdesk.opsdeskbackend: INFO
